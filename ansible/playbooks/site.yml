---
- name: Prepare Docker hosts
  hosts: docker_hosts
  become: true
  tasks:
    - name: Apply Docker host role
      ansible.builtin.import_role:
        name: "{{ playbook_dir }}/../roles/docker_host"

- name: Deploy Oficina container stacks
  hosts: docker_hosts
  become: true
  serial: 1
  tasks:
    - name: Apply Oficina runtime role
      ansible.builtin.import_role:
        name: "{{ playbook_dir }}/../roles/oficina_runtime"
