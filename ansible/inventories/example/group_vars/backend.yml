---
oficina_stack_name: backend
oficina_compose_project_name: oficina-backend

backend_host_port: 8080
backend_container_port: 8080

backend_env:
  PUBLIC_API_BASE_URL: "https://api.oficinamyuu.com.br"
  FRONTEND_BASE_URL: "https://oficinamyuu.com.br"
  CORS_ALLOWED_ORIGINS: "https://oficinamyuu.com.br,https://www.oficinamyuu.com.br"
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  DISCORD_GUILD_ID: ""
  DATABASE_HOST: ""
  DATABASE_PORT: "3306"
  DATABASE_NAME: ""
  DATABASE_USER: ""
  DATABASE_PASSWORD: ""

oficina_state_directories:
  - path: /var/lib/oficina
    owner: root
    group: root
    mode: "0755"

oficina_compose_assets:
  - src: "{{ playbook_dir }}/../../backend/static/"
    dest: static/
    mode: "0644"
    directory_mode: "0755"

oficina_services:
  - name: api
    image: "{{ oficina_registry }}/{{ oficina_image_namespace }}/oficina-backend:latest"
    container_name: oficina-backend
    ipc: host
    env: "{{ backend_env }}"
    ports:
      - "{{ backend_host_port }}:{{ backend_container_port }}"
    volumes:
      - "./static:/app/static:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
