name: oficina-services

services:
  api:
    image: ghcr.io/kileo13/oficina-backend:latest
    container_name: oficina-backend
    restart: unless-stopped
    ports:
      - "6781:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/oficina-services.db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
