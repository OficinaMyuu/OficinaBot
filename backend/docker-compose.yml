services:
  api:
    image: ghcr.io/kileo13/oficinaservices/oficina-backend:latest
    container_name: oficina-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/oficina-services.db
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
