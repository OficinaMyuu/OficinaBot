name: Build and Push Backend to GHCR

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
      - "backend/**"
      - "database/**"
      - "frontend/**"
      - "!backend/terraform/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository owner name in lowercase
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/oficina-backend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/oficina-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
